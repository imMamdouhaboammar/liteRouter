name: Bug Report
description: Report reproducible defects, unexpected routing behavior, or proxy panics.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify the defect against the latest `main` commit before submitting.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What unexpected behavior did you observe?
      placeholder: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Steps
      description: Exact commands, curl payloads, or code snippets to reproduce the issue.
      placeholder: |
        1. Run `./bin/literouter --port=8080`
        2. Send curl request: `curl ...`
        3. Observe error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Telemetry
      description: Include relevant liteRouter logs or response headers (`X-LiteRouter-*`).
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Go version (`go version`), and Rust version (`rustc --version`).
      placeholder: macOS 15.0 / Go 1.22.5 / Rust 1.81.0
    validations:
      required: true
